          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
        </div>
      </a>

      <button class="smart-fab-item" id="smartFabAi">
        <span class="smart-fab-label">ИИ-Помощник 24/7</span>
        <div class="smart-fab-btn smart-fab-btn--ai">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="10" rx="3"/>
            <circle cx="9" cy="16" r="1.5" fill="currentColor"/>
            <circle cx="15" cy="16" r="1.5" fill="currentColor"/>
            <path d="M12 2v6M9 5h6"/>
          </svg>
        </div>
      </button>
    </div>

    <!-- Main Trigger Button -->
    <button class="smart-fab-trigger" id="smartFabTrigger" aria-label="Открыть контакты и ИИ-помощника">
      <span class="smart-fab-status-dot"></span>
      <span class="smart-fab-tooltip">Написать нам</span>
      <svg class="smart-fab-icon-open" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
      </svg>
      <svg class="smart-fab-icon-close" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M18 6 6 18M6 6l12 12"/>
      </svg>
    </button>

    <!-- AI Chat Window -->
    <div class="ai-chat-window" id="aiChatWindow" aria-hidden="true">
      <div class="ai-chat-header">
        <div class="ai-chat-header-info">
          <div class="ai-chat-avatar">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="10" rx="3"/>
              <circle cx="9" cy="16" r="1.5" fill="currentColor"/>
              <circle cx="15" cy="16" r="1.5" fill="currentColor"/>
              <path d="M12 2v6M9 5h6"/>
            </svg>
          </div>
          <div>
            <div class="ai-chat-title">ИИ-Помощник Shebercraft</div>
            <div class="ai-chat-status"><span class="status-dot">●</span> Онлайн</div>
          </div>
        </div>
        <button class="ai-chat-close" id="aiChatClose" aria-label="Закрыть консультанта" tabindex="-1">&times;</button>
      </div>

      <div class="ai-chat-messages" id="aiChatMessages">
        <div class="ai-msg ai-msg--bot">
          <div class="ai-msg-bubble">
            Привет! Я ИИ-помощник Shebercraft. Задайте вопрос по разработке сайтов, Битрикс24 или автоматизации — помогу сориентироваться по ценам и решениям!
          </div>
        </div>
      </div>

      <div class="ai-quick-prompts" id="aiQuickPrompts">
        <button class="ai-prompt-chip" data-prompt="Сколько стоит заказать сайт?" tabindex="-1">Разработка сайта</button>
        <button class="ai-prompt-chip" data-prompt="Как работает AI чат-бот для WhatsApp?" tabindex="-1">AI Чат-бот</button>
        <button class="ai-prompt-chip" data-prompt="Сколько стоит внедрение БП в Битрикс24?" tabindex="-1">Цена и сроки</button>
      </div>

      <form class="ai-chat-input-form" id="aiChatForm">
        <input type="text" class="ai-chat-input" id="aiChatInput" placeholder="Написать сообщение..." autocomplete="off" tabindex="-1" />
        <button type="submit" class="ai-chat-send" id="aiChatSend" aria-label="Отправить" tabindex="-1">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
        </button>
      </form>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
